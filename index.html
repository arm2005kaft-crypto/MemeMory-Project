<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container" style="justify-content: space-between;">
        
        <!-- Top Header & Content -->
        <div style="width: 100%;">
            
            <!-- Header Bar -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 4px;">
                    <img src="images/logo.png" alt="Logo" style="height: 24px; width: auto;">
                    <span style="font-weight: bold; font-size: 14px; color: #6c5ce7;">MemeMory</span>
                </div>
                <div style="flex: 1; position: relative; margin: 0 5px;">
                    <input type="text" placeholder="🔍 Search" style="width: 100%; padding: 6px 12px; border-radius: 15px; border: 1px solid #555; font-size: 12px; outline: none;">
                </div>
                <a href="landing.html" style="text-decoration: none; font-size: 18px; color: #333;" title="Logout">🚪</a>
            </div>

            <!-- Welcome Title -->
            <h2 style="font-size: 26px; font-weight: normal; margin-bottom: 20px;">Welcome</h2>

            <!-- Meme Card 1 (Calculus1) -->
            <div style="border: 1.5px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 20px; background-color: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 15px; font-weight: 500;">Calculus1 <small style="font-size: 11px; color: #666;">(by you)</small></span>
                    <div style="display: flex; gap: 10px; font-size: 14px;">
                        <span style="cursor: pointer;" title="Edit">✏️</span>
                        <span style="cursor: pointer;" title="Favorite">❤️</span>
                        <span style="cursor: pointer;" title="Report">🚩</span>
                    </div>
                </div>
                <!-- Image Display Area -->
                <div style="width: 100%; height: 140px; border: 1px solid #888; border-radius: 6px; background-color: #fcfcfc; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;">
                    [ Meme Image Placeholder ]
                </div>
            </div>

            <!-- Meme Card 2 (Operating System) -->
            <div style="border: 1.5px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 20px; background-color: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 15px; font-weight: 500;">operating system</span>
                    <div style="display: flex; gap: 10px; font-size: 14px;">
                        <span style="cursor: pointer;" title="Favorite">❤️</span>
                        <span style="cursor: pointer;" title="Report">🚩</span>
                    </div>
                </div>
                <!-- Image Display Area -->
                <div style="width: 100%; height: 140px; border: 1px solid #888; border-radius: 6px; background-color: #fcfcfc; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;">
                    [ Meme Image Placeholder ]
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-navbar">
            <a href="index.html" style="font-weight: bold;">🏠</a>
            <a href="upload.html">➕</a>
            <a href="favorites.html">❤️</a>
        </div>

    </div>

</body>
</html>
