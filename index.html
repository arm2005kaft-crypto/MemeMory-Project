<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container" style="justify-content: space-between;">
        
        <!-- Top Header & Content -->
        <div style="width: 100%;">
            
            <!-- Header Bar -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 20px;">
                <!-- Logo Only -->
                <div style="display: flex; align-items: center;">
                    <img src="images/logo.png" alt="MemeMory Logo" style="height: 28px; width: auto; display: block;">
                </div>
                <!-- Search Bar -->
                <div style="flex: 1; margin: 0 8px;">
                    <input type="text" placeholder="Search..." style="width: 100%; padding: 6px 12px; border-radius: 15px; border: 1px solid #555; font-size: 12px; outline: none;">
                </div>
                <!-- Logout Icon/Text -->
                <a href="landing.html" style="text-decoration: none; font-size: 12px; color: #333; font-weight: bold; border: 1px solid #ccc; padding: 4px 8px; border-radius: 4px;">Logout</a>
            </div>

            <!-- Welcome Title -->
            <h2 style="font-size: 26px; font-weight: normal; margin-bottom: 20px; color: #000;">Welcome</h2>

            <!-- Meme Card 1 (Calculus1) -->
            <div style="border: 1.5px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 15px; background-color: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 15px; font-weight: 500;">Calculus1 <small style="font-size: 11px; color: #666;">(by you)</small></span>
                    <div style="display: flex; gap: 8px; font-size: 12px;">
                        <button style="background:none; border:none; cursor:pointer; color:#555;">[Edit]</button>
                        <button style="background:none; border:none; cursor:pointer; color:#555;">[Like]</button>
                        <button style="background:none; border:none; cursor:pointer; color:#555;">[Flag]</button>
                    </div>
                </div>
                <!-- Image Area -->
                <div style="width: 100%; height: 140px; border: 1px solid #888; border-radius: 6px; background-color: #fcfcfc; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;">
                    [ Meme Image Placeholder ]
                </div>
            </div>

            <!-- Meme Card 2 (Operating System) -->
            <div style="border: 1.5px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 15px; background-color: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 15px; font-weight: 500;">operating system</span>
                    <div style="display: flex; gap: 8px; font-size: 12px;">
                        <button style="background:none; border:none; cursor:pointer; color:#555;">[Like]</button>
                        <button style="background:none; border:none; cursor:pointer; color:#555;">[Flag]</button>
                    </div>
                </div>
                <!-- Image Area -->
                <div style="width: 100%; height: 140px; border: 1px solid #888; border-radius: 6px; background-color: #fcfcfc; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;">
                    [ Meme Image Placeholder ]
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div style="border-top: 1px solid #ddd; padding-top: 10px; display: flex; justify-content: space-around; width: 100%;">
            <a href="index.html" style="text-decoration:none; color:#000; font-weight:bold; font-size:14px;">Home</a>
            <a href="upload.html" style="text-decoration:none; color:#555; font-weight:bold; font-size:14px;">Create</a>
            <a href="favorites.html" style="text-decoration:none; color:#555; font-weight:bold; font-size:14px;">Favorites</a>
        </div>

    </div>

</body>
</html>
