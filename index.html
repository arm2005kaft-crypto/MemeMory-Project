<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Welcome</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; max-width: 400px; margin: 0 auto; padding: 20px; text-align: center;">
        
        <!-- Logo -->
        <div style="margin-bottom: 40px;">
            <img src="images/logo.png" alt="MemeMory Logo" style="height: 55px; width: auto; display: block; margin: 0 auto 20px auto;">
            <p style="font-size: 14px; color: #666; line-height: 1.5; margin: 0;">
                Your centralized academic platform for course-related memes and smart revision.
            </p>
        </div>

        <!-- Action Buttons (Matched Blue Color) -->
        <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
            <!-- Log In Button -->
            <a href="login.html" style="text-decoration: none; padding: 12px; background-color: #007bff; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 600; display: block; text-align: center;">
                Log In
            </a>

            <!-- Register Button -->
            <a href="register.html" style="text-decoration: none; padding: 12px; background-color: #fff; color: #007bff; border: 1.5px solid #007bff; border-radius: 6px; font-size: 14px; font-weight: 600; display: block; text-align: center;">
                Register
            </a>
        </div>

    </div>
</body>
</html>
