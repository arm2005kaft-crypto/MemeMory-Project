<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Upload Meme</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 95vh; max-width: 480px; margin: 0 auto; padding: 15px; box-sizing: border-box;">
        <div style="width: 100%;">
            <!-- Header Bar -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <a href="index.html">
                    <img src="images/logo.png" alt="MemeMory Logo" style="height: 26px; width: auto; display: block;">
                </a>
                <a href="index.html" style="text-decoration: none; font-size: 13px; color: #666; font-weight: 500;">Cancel</a>
            </div>

            <!-- Form Container -->
            <form action="index.html" method="GET" style="display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Image Upload Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Select Meme Image (PNG/JPG up to 5MB)</label>
                    <input type="file" accept="image/png, image/jpeg" required style="padding: 10px; border: 1px dashed #007bff; border-radius: 6px; background-color: #f8f9fa; font-size: 13px;">
                </div>

                <!-- Title Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Title</label>
                    <input type="text" name="title" placeholder="e.g., Pointer in C++" required style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none;">
                </div>

                <!-- Course Tag Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Course Tag</label>
                    <input type="text" name="course" placeholder="e.g., IT320" required style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none;">
                </div>

                <!-- Description Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Short Description (Optional)</label>
                    <textarea name="description" placeholder="Add a brief explanation..." rows="3" style="padding: 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; outline: none; resize: none;"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" style="margin-top: 5px; padding: 11px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
                    Publish Meme
                </button>
            </form>
        </div>

        <!-- Bottom Navigation Bar -->
        <div style="border-top: 1px solid #eee; padding-top: 12px; display: flex; justify-content: space-around; width: 100%; align-items: center; background-color: #fff; margin-top: 20px;">
            <a href="index.html" title="Home" style="text-decoration: none; padding: 6px 12px; display: flex; align-items: center;">
                <img src="images/home-icon.png" alt="Home" style="width: 22px; height: 22px; display: block; opacity: 0.6;">
            </a>
            <a href="upload.html" title="Create" style="text-decoration: none; background-color: #f0f4f8; padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,123,255,0.15); display: flex; align-items: center;">
                <img src="images/create-icon.png" alt="Create" style="width: 22px; height: 22px; display: block;">
            </a>
            <a href="favorites.html" title="Favorites" style="text-decoration: none; padding: 6px 12px; display: flex; align-items: center;">
                <img src="images/favorites-icon.png" alt="Favorites" style="width: 22px; height: 22px; display: block; opacity: 0.6;">
            </a>
        </div>
    </div>
</body>
</html>
