<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Create Meme</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container" style="justify-content: flex-start;">
        
        <!-- Back Arrow -->
        <div style="width: 100%; text-align: left;">
            <a href="index.html" class="back-arrow">&larr;</a>
        </div>

        <!-- Header -->
        <h2 style="text-align: center; margin-bottom: 20px; font-size: 22px; font-weight: normal;">Create your meme</h2>
        
        <!-- Form Container Box -->
        <div style="border: 1.5px solid #444; padding: 15px; border-radius: 10px; width: 100%; background-color: #fff; margin-bottom: 20px;">
            
            <!-- Title Input -->
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; display: block; margin-bottom: 5px;">Add title :</label>
                <input type="text" class="input-box" style="margin-bottom: 0;" placeholder="Enter meme title...">
            </div>

            <!-- Upload Box -->
            <div style="border: 2px dashed #777; height: 160px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; background-color: #fafafa; cursor: pointer;">
                <span style="font-size: 26px; margin-bottom: 5px;">📤</span>
                <span style="font-size: 13px; color: #555;">Upload Image</span>
            </div>

            <!-- Description Input -->
            <div>
                <input type="text" class="input-box" style="margin-bottom: 0; font-size: 12px;" placeholder="Add short description">
            </div>

        </div>

        <!-- Post Button -->
        <div style="width: 60%; margin: 0 auto;">
            <button class="btn-blue">post</button>
        </div>

    </div>

</body>
</html>
