<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container" style="justify-content: flex-start;">
        
        <!-- Back Arrow -->
        <div style="width: 100%; text-align: left;">
            <a href="landing.html" class="back-arrow">&larr;</a>
        </div>

        <!-- Header -->
        <div style="width: 100%; margin-top: 15px; margin-bottom: 30px;">
            <h2 style="font-size: 28px; color: #000; font-weight: normal; border-bottom: 2px solid #000; display: inline-block; padding-bottom: 5px;">Register</h2>
        </div>

        <!-- Register Form -->
        <form style="width: 100%; text-align: center;" onsubmit="return false;">
            <input type="text" placeholder="Name" class="input-box" required>
            <input type="email" placeholder="Email" class="input-box" required>
            <input type="password" placeholder="Password" class="input-box" required>
            <input type="password" placeholder="Confirm Password" class="input-box" required>

            <p style="font-size: 13px; margin-bottom: 20px; color: #333;">
                have an account? <a href="login.html" style="color: #000; font-weight: bold; text-decoration: underline;">login</a>
            </p>

            <div style="width: 70%; margin: 0 auto;">
                <button type="submit" class="btn-blue">Creat Account</button>
            </div>
        </form>

    </div>

</body>
</html>
