<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeMory - Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; max-width: 400px; margin: 0 auto; padding: 20px;">
        
        <!-- Logo Only -->
        <div style="margin-bottom: 30px; text-align: center;">
            <a href="index.html">
                <img src="images/logo.png" alt="MemeMory Logo" style="height: 50px; width: auto; display: block; margin: 0 auto;">
            </a>
        </div>

        <!-- Forgot & Reset Password Form Container -->
        <div style="width: 100%; background-color: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; box-sizing: border-box;">
            <form id="resetForm" style="display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Email Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" required style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none;">
                </div>

                <!-- New Password Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required minlength="8" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none;">
                </div>

                <!-- Confirm New Password Field -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 13px; font-weight: 600; color: #333;">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required minlength="8" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none;">
                </div>

                <!-- Submit Button -->
                <button type="submit" style="margin-top: 10px; padding: 11px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Link Back to Login -->
        <div style="margin-top: 20px; font-size: 13px; color: #555; text-align: center;">
            Remember your password? <a href="login.html" style="color: #007bff; font-weight: 600; text-decoration: none;">Log In</a>
        </div>

    </div>

    <!-- JavaScript to Handle Password Reset via LocalStorage -->
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const emailInput = document.getElementById('email').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // التحقق من تطابق كلمتي المرور
            if (newPassword !== confirmPassword) {
                alert("Error: New passwords do not match!");
                return;
            }

            // جلب المستخدم المخزن
            let savedUser = JSON.parse(localStorage.getItem('registeredUser'));

            if (savedUser && savedUser.email === emailInput) {
                // تحديث كلمة المرور في الـ LocalStorage
                savedUser.password = newPassword;
                localStorage.setItem('registeredUser', JSON.stringify(savedUser));

                alert("Success: Password has been reset successfully! Please log in with your new password.");
                window.location.href = "login.html";
            } else {
                alert("Error: This email is not registered in our system!");
            }
        });
    </script>
</body>
</html>
